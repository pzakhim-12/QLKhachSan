{% extends 'base.html' %}

{% block content %}
<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 80vh;">
        <div class="col-12 col-md-6 col-lg-5">
            <div class="card shadow-lg border-0 py-3" style="border-radius: 20px; background: #ffffff;">
                <div class="card-header text-center bg-transparent border-0 pt-4 pb-2">
                    <h2 class="fw-bold mb-1" style="color: #042759; letter-spacing: 1px;">🏨 ZAGOHAVEN</h2>
                    <p class="text-muted small">Tạo tài khoản để nhận nhiều ưu đãi đặt phòng.</p>
                </div>
                
                <div class="card-body px-4 px-md-5">
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-danger alert-dismissible fade show small py-2" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="POST" action="{% url 'register' %}">
                        {% csrf_token %}
                        <div class="form-floating mb-3">
                            <input type="text" name="username" class="form-control bg-light border-0" id="regUsername" placeholder="Username" style="border-radius: 12px;" required>
                            <label for="regUsername" class="text-secondary small">Tên đăng nhập</label>
                        </div>

                        <div class="form-floating mb-3">
                            <input type="email" name="email" class="form-control bg-light border-0" id="regEmail" placeholder="Email" style="border-radius: 12px;" required>
                            <label for="regEmail" class="text-secondary small">Địa chỉ Email</label>
                        </div>
                        
                        <div class="form-floating mb-3">
                            <input type="password" name="password" class="form-control bg-light border-0" id="regPassword" placeholder="Password" style="border-radius: 12px;" required>
                            <label for="regPassword" class="text-secondary small">Mật khẩu (Tối thiểu 8 ký tự)</label>
                        </div>

                        <div class="form-floating mb-4">
                            <input type="password" name="password_confirm" class="form-control bg-light border-0" id="regPasswordConfirm" placeholder="Confirm Password" style="border-radius: 12px;" required>
                            <label for="regPasswordConfirm" class="text-secondary small">Xác nhận mật khẩu</label>
                        </div>

                        <div class="form-check mb-4 px-1 small text-muted">
                            <input class="form-check-input" type="checkbox" id="terms" required checked>
                            <label class="form-check-label" for="terms">
                                Tôi đồng ý với các <a href="#" class="text-decoration-none" style="color: #042759;">Điều khoản & Chính sách</a> của khách sạn.
                            </label>
                        </div>

                        <button type="submit" class="btn btn-lg w-100 fw-bold text-white shadow-sm py-2" style="background-color: #042759; border-radius: 12px; transition: all 0.3s ease;">
                            ĐĂNG KÝ TÀI KHOẢN
                        </button>
                    </form>
                </div>

                <div class="card-footer text-center bg-transparent border-0 pb-3">
                    <p class="text-muted small mb-0">Đã có tài khoản? <a href="{% url 'login' %}" class="fw-bold text-decoration-none" style="color: #042759;">Đăng nhập ngay</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .form-control:focus {
        background-color: #fff !important;
        box-shadow: 0 0 0 0.25rem rgba(4, 39, 89, 0.15) !important;
        border-color: #042759 !important;
    }
    .btn:hover {
        opacity: 0.9;
        transform: translateY(-1px);
    }
</style>
{% endblock %}
